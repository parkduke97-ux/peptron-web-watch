name: peptron-web-watch

on:
  schedule:
    # 24시간 내내 5분마다 트리거된다. 로컬 PC가 감시 중이면(하트비트가 최근이면)
    # 아래 "PC 하트비트 확인" 스텝에서 바로 건너뛰므로, 실제 크롤링/알림/커밋은
    # PC가 꺼져있을 때만 실행된다. public 저장소라 Actions 실행 자체는 무료.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: peptron-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: PC 하트비트 확인
        id: heartbeat
        run: python check_heartbeat.py

      - name: Run watcher
        if: steps.heartbeat.outputs.pc_alive != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit snapshot changes
        if: steps.heartbeat.outputs.pc_alive != 'true'
        run: |
          git config user.name "peptron-watch-bot"
          git config user.email "actions@github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "state: 스냅샷 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')) [skip ci]"
            git push
          fi
