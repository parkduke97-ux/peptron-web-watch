name: peptron-web-watch

on:
  schedule:
    # GitHub Actions cron is UTC; KST is UTC+9. These four entries together
    # equal Monday-Friday 07:30-18:30 KST, every five minutes.
    #   22:30-22:55 UTC Sun-Thu -> 07:30-07:55 KST Mon-Fri
    #   23:00-23:55 UTC Sun-Thu -> 08:00-08:55 KST Mon-Fri
    #   00:00-08:55 UTC Mon-Fri -> 09:00-17:55 KST Mon-Fri
    #   09:00-09:30 UTC Mon-Fri -> 18:00-18:30 KST Mon-Fri
    - cron: '30-59/5 22 * * 0-4'
    - cron: '*/5 23 * * 0-4'
    - cron: '*/5 0-8 * * 1-5'
    - cron: '0-30/5 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: peptron-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit snapshot changes
        run: |
          git config user.name "peptron-watch-bot"
          git config user.email "actions@github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "state: 스냅샷 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')) [skip ci]"
            git push
          fi
