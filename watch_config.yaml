telegram:
  token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

# 한국 시간 기준, 평일(주말·공휴일 제외) 이 시간에만 감시한다 (VM·GitHub 공통).
watch_hours:
  start: "07:50"   # 따옴표를 빼면 YAML이 숫자로 읽는다
  end: "19:00"
  extra_holidays: []   # 공휴일 목록에 아직 없는 임시공휴일, 예: ["2026-10-02"]

keywords:
  - 일라이릴리
  - 릴리
  - Lilly
  - 기술이전
  - 계약
  - 공동연구
  - SmartDepot
  - LUNA PHLEX
  - 임상
  - 승인
  - 마일스톤
  - 라이선스

targets:
  - key: ir_faq
    label: 자주묻는질문(FAQ)
    type: IR_FAQ
    page_class: IR
    url: https://peptron.irupsite.co.kr/Default2.aspx

  - key: ir_activity
    label: IR자료실
    type: IR_ACTIVITY
    page_class: IR
    url: https://peptron.irupsite.co.kr/Default2.aspx
    detail_url: https://peptron.irupsite.co.kr/IRActivity/Detail2AJAX.aspx?IRActivityID=

  - key: ir_disclosure
    label: 공시정보
    type: IR_TABLE
    section_id: section004
    page_class: DISCLOSURE
    url: https://peptron.irupsite.co.kr/Default2.aspx

  - key: ir_earning
    label: 경영공시
    type: IR_TABLE
    section_id: section001
    page_class: DISCLOSURE
    url: https://peptron.irupsite.co.kr/Default2.aspx

  - key: corp_news
    label: 펩트론 뉴스
    type: LINK_LIST
    id_param: "no"
    page_class: NEWS
    url: https://www.peptron.co.kr/ds4_1_1.html
